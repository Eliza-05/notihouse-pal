<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin favicon todavía: NotiHouse Pal usa solo su nombre como identidad
         textual (ver LandingHeader). No usar el ícono por defecto de Vite/React. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NotiHouse-Pal</title>

    <!-- Inter: tipografía de la Landing (ver features/landing). Cargada globalmente
         para evitar el "flash" de la fuente del sistema, pero solo se aplica dentro
         de .landing-page — el resto de la app aún no tiene tipografía definida. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Identidad de la app autenticada (housepal_mvp): Manrope (títulos),
         Public Sans (texto) y JetBrains Mono (cifras). Ver components/tokens.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
